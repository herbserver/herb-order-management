<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Herb On Naturals</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Inter", "Segoe UI", sans-serif;
            background: linear-gradient(145deg, #ecfdf5, #f8fafc);
            color: #0f172a;
        }
        .card {
            width: min(92vw, 420px);
            background: #ffffff;
            border: 1px solid #d1fae5;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            padding: 24px;
            text-align: center;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #0f766e;
        }
        p {
            margin: 0 0 16px;
            font-size: 14px;
            line-height: 1.5;
            color: #334155;
        }
        a {
            display: inline-block;
            text-decoration: none;
            border-radius: 999px;
            padding: 10px 16px;
            background: #0f766e;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>No Internet</h1>
        <p>The app is currently offline. Please reconnect and try again.</p>
        <a href="/login">Retry</a>
    </main>
</body>
</html>
