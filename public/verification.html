    <!-- Auto-init: Set dept type and show panel on load -->
    <script>
        var verificationHeaderSearchDebounce = null;

        function syncVerificationSearchInputs(value) {
            var normalizedValue = String(value || '');
            ['deptHeaderSearch', 'globalSearchInput'].forEach(function(id) {
                var input = document.getElementById(id);
                if (input && input.value !== normalizedValue) {
                    input.value = normalizedValue;
                }
            });
        }

        function runVerificationSearch(query) {
            var value = String(query || '').trim();
            syncVerificationSearchInputs(query);
            if (!value) return false;

            if (value.startsWith('#') && typeof window.handleVerificationCommand === 'function') {
                return window.handleVerificationCommand(value);
            }

            if (typeof window.globalSearchOrder === 'function') {
                window.globalSearchOrder(value);
                return true;
            }

            return false;
        }

        function handleVerificationSearchInput(input) {
            if (!input) return;
            var value = String(input.value || '').trim();
            syncVerificationSearchInputs(input.value);

            if (value.startsWith('#')) {
                if (typeof window.handleVerificationCommand === 'function') {
                    window.handleVerificationCommand(value);
                }
                return;
            }

            clearTimeout(verificationHeaderSearchDebounce);
            if (value.length < 3) {
                return;
            }

            verificationHeaderSearchDebounce = setTimeout(function() {
                if (typeof window.globalSearchOrder === 'function') {
                    window.globalSearchOrder(value);
                }
            }, 450);
        }

        function handleVerificationSearchKeypress(event, input) {
            if (event.key !== 'Enter') return;
            event.preventDefault();
            clearTimeout(verificationHeaderSearchDebounce);
            runVerificationSearch(input && input.value);
        }

        document.addEventListener('keydown', function(event) {
            var tag = (document.activeElement && document.activeElement.tagName) || '';
            var isTyping = tag === 'INPUT' || tag === 'TEXTAREA';

            if (event.key === '#' && !isTyping) {
                event.preventDefault();
                if (typeof window.showGlobalSearchBar === 'function') {
                    window.showGlobalSearchBar();
                }
                var input = document.getElementById('globalSearchInput');
                if (input) {
                    input.value = '#';
                    input.focus();
                    input.setSelectionRange(1, 1);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Verification page init...');
            
            // Set department type to verification BEFORE anything loads
            currentDeptType = 'verification';
            
            // Try loading session - common.js loadSession returns session object or null
            // session.js loadSession returns true/false (but common.js overrides it)
            var sessionResult = loadSession();
            
            // common.js version returns session object, session.js returns boolean
            var session = null;
            if (sessionResult && typeof sessionResult === 'object') {
                session = sessionResult; // common.js version
            } else if (sessionResult === true) {
                // session.js version - use global currentUserType set by it
                session = { type: currentUserType, user: currentUser };
            }
            
            console.log('📋 Session:', session, 'Type:', session?.type, 'currentUserType:', currentUserType);
            
            // Check if logged in as department
            if (!session || (session.type !== 'department' && currentUserType !== 'department')) {
                console.log('❌ Not department user, redirecting to login...');
                window.location.href = '/';
                return;
            }
            
            // Set current user from session
            if (session.user) currentUser = session.user;
            
            // Display department ID
            var deptIdEl = document.getElementById('deptIdDisplay');
            if (deptIdEl) deptIdEl.textContent = (currentUser && currentUser.id) || (session.user && session.user.id) || '';
            
            // Load verification orders
            var initialVerificationTab = 'pending';
            if (typeof getVerificationTabFromHash === 'function') {
                initialVerificationTab = getVerificationTabFromHash();
            }

            if (typeof switchVerificationTab === 'function') {
                switchVerificationTab(initialVerificationTab, false);
            }
            if (typeof updateVerificationTabHash === 'function') {
                updateVerificationTabHash(initialVerificationTab, true);
            }
            
            console.log('✅ Verification panel ready!');
        });
    </script>

</body>

</html>
