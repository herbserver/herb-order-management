<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Herb On Naturals - Verification Department</title>

    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="js/core/config.js" as="script">
    <link rel="preload" href="js/core/session.js" as="script">
    <script src="js/core/page-loader.js?v=4"></script>
    <script src="js/core/pwa.js?v=1" defer></script>

    <script src="https://cdn.tailwindcss.com" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js" async></script>

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
    <div id="app">
        <!--====================VERIFICATION DEPARTMENT PANEL====================-->
        <div id="departmentPanel" class="font-['Poppins']">
            <div class="flex min-h-screen bg-slate-50 relative">

                <!-- DEPARTMENT SIDEBAR BACKDROP (Mobile) -->
                <div id="deptSidebarBackdrop" onclick="toggleDeptSidebar()"
                    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 opacity-0 pointer-events-none backdrop-fade lg:hidden">
                </div>

                <!-- DEPARTMENT SIDEBAR -->
                <aside id="deptSidebar"
                    class="w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col fixed left-0 top-0 h-full z-40 transform -translate-x-full lg:translate-x-0 sidebar-bouncy shadow-xl lg:shadow-none">

                    <!-- Logo Header -->
                    <div class="p-5 border-b border-slate-100 bg-gradient-to-r from-emerald-50 to-teal-50 relative">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-xl flex items-center justify-center p-1.5 shadow-lg shadow-indigo-200">
                                <img src="icon.png" alt="HON" class="w-full h-full object-contain">
                            </div>
                            <div>
                                <h1 class="text-lg font-black tracking-tight text-slate-800">Herb On Naturals
                                </h1>
                                <p class="text-[10px] text-indigo-600 font-semibold -mt-0.5" id="deptSidebarSubtitle">
                                    Verification Team</p>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar Navigation -->
                    <nav class="flex-1 py-4 overflow-y-auto">

                        <!-- VERIFICATION NAV GROUP -->
                        <div id="navGroupVerification" class="px-3 space-y-1 mb-6">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">
                                Verification</p>
                            <button onclick="switchVerificationTab('pending')" id="deptTabPending"
                                class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all">
                                <span class="text-lg">📍</span>
                                <span class="flex-1 text-left">Pending</span>
                            </button>
                            <button onclick="switchVerificationTab('unverified')" id="deptTabUnverified"
                                class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all">
                                <span class="text-lg">⏸️</span>
                                <span class="flex-1 text-left">On Hold</span>
                            </button>
                            <button onclick="switchVerificationTab('cancelled')" id="deptTabCancelled"
                                class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all">
                                <span class="text-lg">❌</span>
                                <span class="flex-1 text-left">Cancelled</span>
                            </button>
                        </div>

                    </nav>

                    <!-- Sidebar Footer Actions -->
                    <div class="p-4 border-t border-slate-100 bg-slate-50">
                        <button onclick="showGlobalSearchBar()"
                            class="w-full h-10 flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl text-xs font-bold hover:shadow-lg transition-all mb-2">
                            <span>🔍</span> SEARCH ORDER
                        </button>
                        <button onclick="logout()"
                            class="w-full bg-white text-rose-500 border border-rose-200 px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-rose-50 transition-all flex items-center justify-center gap-2">
                            <span>🚪</span> Logout
                        </button>
                    </div>
                </aside>

                <!-- MAIN CONTENT AREA -->
                <div class="flex-1 lg:ml-64 h-screen flex flex-col overflow-hidden">

                    <!-- TOP HEADER -->
                    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div class="px-4 sm:px-6 py-3 flex items-center gap-4">

                            <!-- Mobile Menu Toggle -->
                            <button onclick="toggleDeptSidebar()"
                                class="lg:hidden p-2 rounded-xl hover:bg-slate-100 transition-colors">
                                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>

                            <!-- Dept Identification -->
                            <div class="flex items-center gap-3">
                                <h2 id="deptHeaderTitle" class="text-sm font-bold text-slate-800 hidden md:block">
                                    Verification Dept</h2>
                                <span class="text-slate-300 hidden md:block">|</span>
                                <div
                                    class="flex items-center gap-1.5 px-3 py-1 bg-indigo-50 rounded-lg border border-indigo-100">
                                    <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-tight">ID:</span>
                                    <span id="deptIdDisplay" class="text-xs font-black text-indigo-600 font-mono"></span>
                                </div>
                            </div>

                            <!-- Search Bar -->
                            <div class="flex-1 max-w-lg relative">
                                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input type="text" id="deptHeaderSearch" placeholder="Search or use #pending #history"
                                    class="w-full pl-11 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all placeholder:text-slate-400"
                                    oninput="handleVerificationSearchInput(this)"
                                    onkeypress="handleVerificationSearchKeypress(event, this)">
                            </div>


                            <!-- Common Header Actions/Filters -->
                            <div class="ml-auto flex items-center gap-3">
                                <button id="deptExportBtn"
                                    class="hidden bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-700 shadow-sm transition-all flex items-center gap-2">
                                    <span>📥</span> Export Data
                                </button>
                                <input type="date" id="headerDateFilter"
                                    class="hidden border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-medium focus:border-indigo-400 outline-none">
                            </div>
                        </div>
                    </header>

                    <!-- SCROLLABLE CONTENT BODY -->
                    <div id="deptMainScrollArea" class="flex-1 overflow-y-auto p-4 md:p-8">
                        <div id="deptMessage"
                            class="hidden mb-6 p-4 rounded-xl text-sm border-l-4 border-indigo-500 bg-white shadow-sm font-medium">
                        </div>

                        <!-- Verification Dept Content -->
                        <div id="verificationDeptContent" class="space-y-6">

                            <!-- PENDING TAB -->
                            <div id="verificationPendingTab" class="animate-fadeIn">
                                <div class="bg-white/80 backdrop-blur-md -mx-8 px-8 pb-6 pt-5 border-b border-slate-100 mb-6 shadow-sm">
                                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center px-2 gap-4">
                                        <h2 class="text-2xl font-black tracking-tight text-slate-800 flex items-center gap-3">
                                            <span class="w-3 h-8 bg-gradient-to-b from-blue-500 to-indigo-600 rounded-full block"></span>
                                            Pending Verification
                                        </h2>
                                        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-4 w-full xl:w-auto">
                                            <!-- Dashboard Stats (Mini) -->
                                            <div class="flex flex-wrap sm:flex-nowrap gap-3 mr-0 md:mr-2">
                                                <!-- Today Card -->
                                                <div data-pending-range="today" onclick="applyVerificationPendingQuickFilter('today')"
                                                    class="bg-gradient-to-br from-blue-50 to-indigo-50/30 text-blue-700 px-4 py-2 rounded-2xl border border-blue-100 flex items-center gap-3 cursor-pointer hover:bg-blue-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-blue-500 text-white flex items-center justify-center text-sm shadow-md shadow-blue-200">📅</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-blue-400 uppercase tracking-widest leading-none">Today</span>
                                                        <span class="text-base font-black text-blue-900 mt-1 leading-none" id="miniStatVerifyToday">0</span>
                                                    </div>
                                                </div>

                                                <!-- Yesterday Card -->
                                                <div data-pending-range="yesterday" onclick="applyVerificationPendingQuickFilter('yesterday')"
                                                    class="bg-gradient-to-br from-indigo-50 to-purple-50/30 text-indigo-700 px-4 py-2 rounded-2xl border border-indigo-100 flex items-center gap-3 cursor-pointer hover:bg-indigo-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-indigo-500 text-white flex items-center justify-center text-sm shadow-md shadow-indigo-200">⏮️</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-indigo-400 uppercase tracking-widest leading-none">Yest</span>
                                                        <span class="text-base font-black text-indigo-900 mt-1 leading-none" id="miniStatVerifyYesterday">0</span>
                                                    </div>
                                                </div>

                                                <!-- 7 Days Card -->
                                                <div data-pending-range="week" onclick="applyVerificationPendingQuickFilter('week')"
                                                    class="bg-gradient-to-br from-purple-50 to-pink-50/30 text-purple-700 px-4 py-2 rounded-2xl border border-purple-100 flex items-center gap-3 cursor-pointer hover:bg-purple-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-purple-500 text-white flex items-center justify-center text-sm shadow-md shadow-purple-200">📊</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-purple-400 uppercase tracking-widest leading-none">7 Days</span>
                                                        <span class="text-base font-black text-purple-900 mt-1 leading-none" id="miniStatVerifyWeek">0</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="flex flex-grow md:flex-initial flex-wrap md:flex-nowrap gap-2">
                                                <div class="relative flex-grow min-w-[140px] md:max-w-xs">
                                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
                                                    <input type="text" id="verificationPendingSearch"
                                                        placeholder="Mobile/Name..."
                                                        oninput="filterVerificationOrders(this.value)"
                                                        class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all placeholder:text-slate-400">
                                                </div>
                                                <div class="relative flex-grow min-w-[150px] md:max-w-xs">
                                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">👤</span>
                                                    <select id="verificationPendingEmployeeFilter" onchange="applyVerificationPendingEmployeeFilter()"
                                                        class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all text-slate-700 appearance-none cursor-pointer">
                                                        <option value="">👤 All Employees</option>
                                                    </select>
                                                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]">▼</span>
                                                </div>
                                                <div class="relative">
                                                    <input type="date" id="verificationPendingDate" onchange="applyVerificationPendingDateFilter()"
                                                        class="w-full md:w-auto px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all text-slate-700">
                                                </div>
                                                <button type="button" onclick="clearVerificationPendingFilters()"
                                                    class="h-[38px] px-3.5 text-slate-500 hover:text-slate-700 bg-white border border-slate-200 rounded-xl text-xs font-bold transition-all hover:bg-slate-50 active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                                                    <span>✕</span> Clear
                                                </button>
                                                <button type="button" onclick="loadDeptOrders()"
                                                    class="h-[38px] px-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl text-xs font-bold transition-all hover:shadow-lg hover:shadow-blue-200 active:scale-95 flex items-center justify-center gap-1.5 shadow-md">
                                                    <span>🔄</span> Refresh
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Quick Filter Buttons -->
                                <div id="dateFilterButtons" class="bg-white mb-4 px-2 hidden shadow-md">
                                    <div
                                        class="flex flex-wrap gap-2 items-center p-3 bg-gradient-to-r from-blue-50 to-emerald-50 rounded-xl border border-blue-200 shadow-sm">
                                        <span class="text-xs font-bold text-gray-600 uppercase tracking-wide">Quick
                                            Filters:</span>
                                        <div id="filterButtonsContainer" class="flex flex-wrap gap-2"></div>
                                    </div>
                                </div>
                                <div id="pendingVerificationList"
                                    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                </div>
                            </div>

                            <!-- UNVERIFIED TAB -->
                            <div id="verificationUnverifiedTab" class="hidden animate-fadeIn">
                                <div class="bg-white/80 backdrop-blur-md -mx-8 px-8 pb-6 pt-5 border-b border-slate-100 mb-6 shadow-sm">
                                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center px-2 gap-4">
                                        <h2 class="text-2xl font-black tracking-tight text-slate-800 flex items-center gap-3">
                                            <span class="w-3 h-8 bg-gradient-to-b from-amber-500 to-orange-600 rounded-full block"></span>
                                            On Hold / Unverified
                                        </h2>
                                        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-4 w-full xl:w-auto">
                                            <!-- Dashboard Stats (Mini) -->
                                            <div class="flex flex-wrap sm:flex-nowrap gap-3 mr-0 md:mr-2">
                                                <!-- Today Card -->
                                                <div data-unverified-range="today" onclick="applyVerificationUnverifiedQuickFilter('today')"
                                                    class="bg-gradient-to-br from-amber-50 to-orange-50/30 text-amber-700 px-4 py-2 rounded-2xl border border-amber-100 flex items-center gap-3 cursor-pointer hover:bg-amber-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-amber-500 text-white flex items-center justify-center text-sm shadow-md shadow-amber-200">📅</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-amber-400 uppercase tracking-widest leading-none">Today</span>
                                                        <span class="text-base font-black text-amber-900 mt-1 leading-none" id="miniStatUnverifiedToday">0</span>
                                                    </div>
                                                </div>

                                                <!-- Yesterday Card -->
                                                <div data-unverified-range="yesterday" onclick="applyVerificationUnverifiedQuickFilter('yesterday')"
                                                    class="bg-gradient-to-br from-orange-50 to-yellow-50/30 text-orange-700 px-4 py-2 rounded-2xl border border-orange-100 flex items-center gap-3 cursor-pointer hover:bg-orange-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-orange-500 text-white flex items-center justify-center text-sm shadow-md shadow-orange-200">⏮️</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-orange-400 uppercase tracking-widest leading-none">Yest</span>
                                                        <span class="text-base font-black text-orange-900 mt-1 leading-none" id="miniStatUnverifiedYesterday">0</span>
                                                    </div>
                                                </div>

                                                <!-- 7 Days Card -->
                                                <div data-unverified-range="week" onclick="applyVerificationUnverifiedQuickFilter('week')"
                                                    class="bg-gradient-to-br from-yellow-50 to-amber-50/30 text-yellow-700 px-4 py-2 rounded-2xl border border-yellow-100 flex items-center gap-3 cursor-pointer hover:bg-yellow-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-yellow-500 text-white flex items-center justify-center text-sm shadow-md shadow-yellow-200">📊</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-yellow-600 uppercase tracking-widest leading-none">7 Days</span>
                                                        <span class="text-base font-black text-yellow-900 mt-1 leading-none" id="miniStatUnverifiedWeek">0</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="flex flex-grow md:flex-initial flex-wrap md:flex-nowrap gap-2">
                                                <div class="relative flex-grow min-w-[140px] md:max-w-xs">
                                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
                                                    <input type="text" id="verificationUnverifiedSearch"
                                                        placeholder="Mobile/Name..."
                                                        oninput="filterVerificationUnverified()"
                                                        class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-amber-500 focus:ring-4 focus:ring-amber-100 transition-all placeholder:text-slate-400">
                                                </div>
                                                <div class="relative flex-grow min-w-[150px] md:max-w-xs">
                                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">👤</span>
                                                    <select id="verificationUnverifiedEmployeeFilter" onchange="applyVerificationUnverifiedEmployeeFilter()"
                                                        class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-amber-500 focus:ring-4 focus:ring-amber-100 transition-all text-slate-700 appearance-none cursor-pointer">
                                                        <option value="">👤 All Employees</option>
                                                    </select>
                                                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]">▼</span>
                                                </div>
                                                <div class="relative">
                                                    <input type="date" id="verificationUnverifiedDate" onchange="applyVerificationUnverifiedDateFilter()"
                                                        class="w-full md:w-auto px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-amber-500 focus:ring-4 focus:ring-amber-100 transition-all text-slate-700">
                                                </div>
                                                <button type="button" onclick="clearVerificationUnverifiedFilters()"
                                                    class="h-[38px] px-3.5 text-slate-500 hover:text-slate-700 bg-white border border-slate-200 rounded-xl text-xs font-bold transition-all hover:bg-slate-50 active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                                                    <span>✕</span> Clear
                                                </button>
                                                <button type="button" onclick="loadVerificationUnverified()"
                                                    class="h-[38px] px-3.5 bg-gradient-to-r from-amber-500 to-orange-600 text-white rounded-xl text-xs font-bold transition-all hover:shadow-lg hover:shadow-amber-200 active:scale-95 flex items-center justify-center gap-1.5 shadow-md">
                                                    <span>🔄</span> Refresh
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="verificationUnverifiedList"
                                    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                </div>
                            </div>

                            <!-- CANCELLED TAB -->
                            <div id="verificationCancelledTab" class="hidden animate-fadeIn">
                                <div class="bg-white/80 backdrop-blur-md -mx-8 px-8 pb-6 pt-5 border-b border-slate-100 mb-6 shadow-sm">
                                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center px-2 gap-4">
                                        <h2 class="text-2xl font-black tracking-tight text-slate-800 flex items-center gap-3">
                                            <span class="w-3 h-8 bg-gradient-to-b from-red-500 to-rose-600 rounded-full block"></span>
                                            Cancelled Orders
                                        </h2>
                                        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-4 w-full xl:w-auto">
                                            <!-- Dashboard Stats (Mini) -->
                                            <div class="flex flex-wrap sm:flex-nowrap gap-3 mr-0 md:mr-2">
                                                <!-- Today Card -->
                                                <div data-cancelled-range="today" onclick="applyVerificationCancelledQuickFilter('today')"
                                                    class="bg-gradient-to-br from-red-50 to-rose-50/30 text-red-700 px-4 py-2 rounded-2xl border border-red-100 flex items-center gap-3 cursor-pointer hover:bg-red-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-red-500 text-white flex items-center justify-center text-sm shadow-md shadow-red-200">📅</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-red-400 uppercase tracking-widest leading-none">Today</span>
                                                        <span class="text-base font-black text-red-900 mt-1 leading-none" id="miniStatCancelledToday">0</span>
                                                    </div>
                                                </div>

                                                <!-- Yesterday Card -->
                                                <div data-cancelled-range="yesterday" onclick="applyVerificationCancelledQuickFilter('yesterday')"
                                                    class="bg-gradient-to-br from-rose-50 to-pink-50/30 text-rose-700 px-4 py-2 rounded-2xl border border-rose-100 flex items-center gap-3 cursor-pointer hover:bg-rose-100 hover:scale-105 active:scale-95 transition-all shadow-sm shrink-0">
                                                    <div class="w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center text-sm shadow-md shadow-rose-200">⏮️</div>
                                                    <div class="flex flex-col">
                                                        <span class="text-[9px] font-black text-rose-400 uppercase tracking-widest leading-none">Yest</span>
                                                        <span class="text-base font-black text-rose-900 mt-1 leading-none" id="miniStatCancelledYesterday">0</span>
                                                    </div>
                                                </div>

    <!-- Auto-init: Set dept type and show panel on load -->
    <script>
        var verificationHeaderSearchDebounce = null;

        function syncVerificationSearchInputs(value) {
            var normalizedValue = String(value || '');
            ['deptHeaderSearch', 'globalSearchInput'].forEach(function(id) {
                var input = document.getElementById(id);
                if (input && input.value !== normalizedValue) {
                    input.value = normalizedValue;
                }
            });
        }

        function runVerificationSearch(query) {
            var value = String(query || '').trim();
            syncVerificationSearchInputs(query);
            if (!value) return false;

            if (value.startsWith('#') && typeof window.handleVerificationCommand === 'function') {
                return window.handleVerificationCommand(value);
            }

            if (typeof window.globalSearchOrder === 'function') {
                window.globalSearchOrder(value);
                return true;
            }

            return false;
        }

        function handleVerificationSearchInput(input) {
            if (!input) return;
            var value = String(input.value || '').trim();
            syncVerificationSearchInputs(input.value);

            if (value.startsWith('#')) {
                if (typeof window.handleVerificationCommand === 'function') {
                    window.handleVerificationCommand(value);
                }
                return;
            }

            clearTimeout(verificationHeaderSearchDebounce);
            if (value.length < 3) {
                return;
            }

            verificationHeaderSearchDebounce = setTimeout(function() {
                if (typeof window.globalSearchOrder === 'function') {
                    window.globalSearchOrder(value);
                }
            }, 450);
        }

        function handleVerificationSearchKeypress(event, input) {
            if (event.key !== 'Enter') return;
            event.preventDefault();
            clearTimeout(verificationHeaderSearchDebounce);
            runVerificationSearch(input && input.value);
        }

        document.addEventListener('keydown', function(event) {
            var tag = (document.activeElement && document.activeElement.tagName) || '';
            var isTyping = tag === 'INPUT' || tag === 'TEXTAREA';

            if (event.key === '#' && !isTyping) {
                event.preventDefault();
                if (typeof window.showGlobalSearchBar === 'function') {
                    window.showGlobalSearchBar();
                }
                var input = document.getElementById('globalSearchInput');
                if (input) {
                    input.value = '#';
                    input.focus();
                    input.setSelectionRange(1, 1);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Verification page init...');
            
            // Set department type to verification BEFORE anything loads
            currentDeptType = 'verification';
            
            // Try loading session - common.js loadSession returns session object or null
            // session.js loadSession returns true/false (but common.js overrides it)
            var sessionResult = loadSession();
            
            // common.js version returns session object, session.js returns boolean
            var session = null;
            if (sessionResult && typeof sessionResult === 'object') {
                session = sessionResult; // common.js version
            } else if (sessionResult === true) {
                // session.js version - use global currentUserType set by it
                session = { type: currentUserType, user: currentUser };
            }
            
            console.log('📋 Session:', session, 'Type:', session?.type, 'currentUserType:', currentUserType);
            
            // Check if logged in as department
            if (!session || (session.type !== 'department' && currentUserType !== 'department')) {
                console.log('❌ Not department user, redirecting to login...');
                window.location.href = '/';
                return;
            }
            
            // Set current user from session
            if (session.user) currentUser = session.user;
            
            // Display department ID
            var deptIdEl = document.getElementById('deptIdDisplay');
            if (deptIdEl) deptIdEl.textContent = (currentUser && currentUser.id) || (session.user && session.user.id) || '';
            
            // Load verification orders
            var initialVerificationTab = 'pending';
            if (typeof getVerificationTabFromHash === 'function') {
                initialVerificationTab = getVerificationTabFromHash();
            }

            if (typeof switchVerificationTab === 'function') {
                switchVerificationTab(initialVerificationTab, false);
            }
            if (typeof updateVerificationTabHash === 'function') {
                updateVerificationTabHash(initialVerificationTab, true);
            }
            
            console.log('✅ Verification panel ready!');
        });
    </script>
